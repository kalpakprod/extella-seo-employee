<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="arch-en-title arch-en-desc">
  <title id="arch-en-title">Extella SEO Employee architecture</title>
  <desc id="arch-en-desc">Extella controls the audit queue. Deterministic CrawlSEO and SEOmator workers produce evidence. Agent Zero only explains facts and receives no site-writing tools.</desc>
  <defs>
    <marker id="arch-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2F6B66"/>
    </marker>
    <marker id="arch-en-stop" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12">
      <circle cx="6" cy="6" r="5" fill="#FAF9F5" stroke="#B44C42" stroke-width="2"/>
      <path d="M3 3L9 9M9 3L3 9" stroke="#B44C42" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#FAF9F5"/>
  <text x="40" y="44" fill="#0A0A0A" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">A verifiable path from website to task</text>
  <text x="40" y="70" fill="#2F6B66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">The deterministic core decides; the model only explains confirmed evidence.</text>

  <rect x="40" y="96" width="240" height="440" rx="20" fill="#F5F3EC" stroke="#D7E0DC" stroke-width="2"/>
  <rect x="320" y="96" width="520" height="440" rx="20" fill="#FFFFFF" stroke="#D7E0DC" stroke-width="2"/>
  <rect x="880" y="96" width="280" height="440" rx="20" fill="#F5F3EC" stroke="#D7E0DC" stroke-width="2"/>
  <text x="64" y="128" fill="#2F6B66" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">EXTELLA · CONTROL</text>
  <text x="344" y="128" fill="#2F6B66" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">DETERMINISTIC AUDIT</text>
  <text x="904" y="128" fill="#2F6B66" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">MODEL BOUNDARY</text>

  <path d="M240 228H360" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M240 388H304Q320 388 320 372V292Q320 276 336 276H360" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M520 244H536Q552 244 552 228V208Q552 192 568 192H580" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M520 276H536Q552 276 552 292V368Q552 384 568 384H580" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M700 192H716Q732 192 732 208V264Q732 280 748 280H752" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M700 384H716Q732 384 732 368V328Q732 312 748 312H752" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M832 280H864Q880 280 880 264V228Q880 212 896 212H920" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M832 312H864Q880 312 880 328V388Q880 404 896 404H920" fill="none" stroke="#2F6B66" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arch-en-arrow)"/>
  <path d="M1000 260V356" fill="none" stroke="#2F6B66" stroke-width="2" marker-end="url(#arch-en-arrow)"/>
  <path d="M1080 212H1132" fill="none" stroke="#B44C42" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arch-en-stop)"/>

  <rect x="284" y="209" width="56" height="22" rx="11" fill="#FAF9F5"/>
  <text x="312" y="224" text-anchor="middle" fill="#2F6B66" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">PLAN</text>
  <rect x="840" y="257" width="76" height="22" rx="11" fill="#FAF9F5"/>
  <text x="878" y="272" text-anchor="middle" fill="#2F6B66" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">FACTS</text>
  <rect x="1008" y="297" width="78" height="22" rx="11" fill="#FAF9F5"/>
  <text x="1047" y="312" text-anchor="middle" fill="#2F6B66" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">EXPLAINS</text>
  <text x="1132" y="190" text-anchor="end" fill="#B44C42" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700">NO WRITE</text>
  <text x="1132" y="238" text-anchor="end" fill="#6B7471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Website · read only</text>

  <rect x="80" y="180" width="160" height="96" rx="16" fill="#FFFFFF" stroke="#2F6B66" stroke-width="2"/>
  <text x="160" y="219" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Panel</text>
  <text x="160" y="244" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">request and status</text>
  <rect x="80" y="340" width="160" height="96" rx="16" fill="#FFFFFF" stroke="#2F6B66" stroke-width="2"/>
  <text x="160" y="379" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">FIFO queue</text>
  <text x="160" y="404" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">targets and retries</text>

  <rect x="360" y="196" width="160" height="128" rx="18" fill="#D4944A"/>
  <text x="440" y="239" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">AuditPlan</text>
  <text x="440" y="265" text-anchor="middle" fill="#281B0D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">profile and budget</text>
  <text x="440" y="289" text-anchor="middle" fill="#281B0D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">limits and rules</text>
  <rect x="580" y="152" width="120" height="80" rx="14" fill="#F5F3EC" stroke="#2F6B66" stroke-width="2"/>
  <text x="640" y="187" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">CrawlSEO</text>
  <text x="640" y="210" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">crawling</text>
  <rect x="580" y="344" width="120" height="80" rx="14" fill="#F5F3EC" stroke="#2F6B66" stroke-width="2"/>
  <text x="640" y="379" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">SEOmator</text>
  <text x="640" y="402" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">checks</text>
  <rect x="752" y="248" width="80" height="96" rx="14" fill="#F5F3EC" stroke="#2F6B66" stroke-width="2"/>
  <text x="792" y="287" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Evidence</text>
  <text x="792" y="312" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">state</text>

  <rect x="920" y="164" width="160" height="96" rx="16" fill="#FFFFFF" stroke="#2F6B66" stroke-width="2"/>
  <text x="1000" y="203" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Agent Zero</text>
  <text x="1000" y="228" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">no tools</text>
  <rect x="920" y="356" width="160" height="96" rx="16" fill="#FFFFFF" stroke="#2F6B66" stroke-width="2"/>
  <text x="1000" y="395" text-anchor="middle" fill="#0A0A0A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Tasks</text>
  <text x="1000" y="420" text-anchor="middle" fill="#56615E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">priority + evidence</text>

  <text x="40" y="574" fill="#6B7471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Optional GSC and DataForSEO enrich the input without changing the trust boundary.</text>
</svg>
