<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Extella SEO Employee</title>
  <defs>
    <linearGradient id="фон" gradientTransform="rotate(75 .5 .5)">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset=".55" stop-color="#F0EBE0"/>
      <stop offset="1" stop-color="#E4DDD0"/>
    </linearGradient>
    <linearGradient id="блик" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="низ" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".8" stop-color="#8C6E3C" stop-opacity="0"/>
      <stop offset="1" stop-color="#8C6E3C" stop-opacity=".14"/>
    </linearGradient>
    <filter id="тень" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34.6" stdDeviation="48.4"
                    flood-color="#5A4628" flood-opacity=".14"/>
    </filter>
    <clipPath id="кп"><rect x="62" y="62" width="388" height="388"
      rx="105"/></clipPath>
  </defs>

  <g filter="url(#тень)">
    <rect x="62" y="62" width="388" height="388" rx="105"
          fill="url(#фон)"/>
  </g>
  <g clip-path="url(#кп)">
    <rect x="62" y="62" width="388" height="388" fill="url(#блик)"/>
    <rect x="62" y="62" width="388" height="388" fill="url(#низ)"/>
    <rect x="62" y="68.9" width="388" height="388" rx="105"
          fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="6.9"/>
  </g>
  <rect x="62" y="62" width="388" height="388" rx="105"
